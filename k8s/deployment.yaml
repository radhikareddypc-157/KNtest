apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-app
  template:
    metadata:
      labels:
        app: java-app
    spec:
      containers:
            - name: java-container
        image: greatest-java-app:latest
        imagePullPolicy: Never
        ports:
                - containerPort: 8080
        readinessProbe:
          exec:
            command:
                        - echo
                        - ready
          initialDelaySeconds: 5
          periodSeconds: 10
